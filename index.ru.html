  <title>Духовные путешествия по Святой Земле</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#1a365d;--secondary:#2b6cb0;--accent:#d69e2e;--bg:#f7fafc;--text:#2d3748;--card:#ffffff;}
    *{box-sizing:border-box;}html,body{height:100%}body{margin:0;font-family:"Assistant","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
    .site{max-width:980px;margin:28px auto;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(10,20,40,0.08);} 
    .hero{background:linear-gradient(135deg,var(--primary),#294563);color:#fff;text-align:center;padding:48px 24px;position:relative;}
    .lang-select{position:absolute;left:18px;top:18px;display:flex;gap:8px;flex-wrap:wrap;}
    .lang-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:6px 10px;border-radius:8px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px;}
    .lang-btn.selected{background:rgba(255,255,255,0.18);}
    .highlight{display:inline-block;margin-top:14px;background:rgba(214,158,46,0.12);border:2px solid var(--accent);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;}
    main{padding:28px;} h2{color:var(--primary);text-align:center;margin:28px 0;font-size:1.6rem;border-bottom:3px solid rgba(43,108,176,0.12);padding-bottom:10px;}
    .tour{background:#fff;border:1px solid #e6edf6;border-radius:10px;margin:18px 0;overflow:hidden;} .tour .header{background:var(--primary);color:#fff;padding:14px 18px;font-weight:700;display:flex;align-items:center;gap:12px;}
    .route-img{width:100%;height:220px;object-fit:cover;border-radius:8px;display:block;margin-bottom:14px;background:#cbd5e0;}
    .step{background:#f8fafc;border:1px solid #edf2f7;padding:12px;border-radius:8px;margin-bottom:12px;} .step .title{color:var(--secondary);font-weight:700;margin-bottom:8px;}
    ul.features-list{list-style:none;padding-left:0;margin:0;} ul.features-list li{padding-left:24px;margin-bottom:8px;position:relative;} ul.features-list li::before{content:"✦";position:absolute;left:0;color:var(--accent);font-weight:700;}
    .features-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px;} .feature{background:#edf2f7;padding:12px;border-radius:8px;}
    .vip{background:#fffaf0;border-left:5px solid var(--accent);padding:18px;margin:18px;border-radius:8px;color:#6b4b14;} .vip .title{font-weight:700;margin-bottom:6px;}
    footer{background:var(--primary);color:#fff;text-align:center;padding:34px 18px;margin-top:18px;} .phone{font-size:1.6rem;font-weight:700;margin:8px 0;display:flex;align-items:center;justify-content:center;gap:10px;}
    .btn-call{display:inline-block;margin-top:12px;background:var(--accent);color:var(--primary);padding:12px 30px;border-radius:999px;text-decoration:none;font-weight:700;box-shadow:0 6px 12px rgba(10,20,40,0.12);} 
    @media (min-width:720px){.features-grid{grid-template-columns:repeat(2,1fr);} .route-img{height:260px;}}
  </style>
</head>
